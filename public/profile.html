<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SWAPPR — My Profile</title>
    <link rel="icon" href="Images/swappr_logo_updated.jpg" type="image/jpeg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/vendor/lucide.js"></script>
    <script src="js/actions.js"></script>
    <style>
      /* ── Page surfaces ───────────────────────────────────────────────────── */
      .page-bg {
        background: transparent;
      }

      .card {
        background: var(--color-surface);
        border-radius: var(--radius-md);
        border: 1px solid var(--color-divider);
        overflow: hidden;
      }

      /* ── Cover banner ────────────────────────────────────────────────────── */
      .cover {
        height: 88px;
        background: var(--color-cover-gradient);
        position: relative;
      }

      /* ── Avatar ──────────────────────────────────────────────────────────── */
      .avatar {
        width: 72px;
        height: 72px;
        border-radius: var(--radius-pill);
        background: var(--color-brand-gradient);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--text-page);
        font-weight: 800;
        color: var(--color-on-header);
        border: 4px solid var(--color-surface);
        box-shadow: var(--shadow-sm);
        position: absolute;
        bottom: -28px;
        left: var(--space-6);
        flex-shrink: 0;
      }

      /* ── Identity block ──────────────────────────────────────────────────── */
      .identity {
        padding: 40px var(--space-6) var(--space-4);
      }

      .profile-name {
        font-size: var(--text-heading);
        font-weight: 700;
        color: var(--color-text);
        display: flex;
        align-items: center;
        gap: var(--space-2);
        flex-wrap: wrap;
      }

      .profile-tagline {
        font-size: var(--text-small);
        font-weight: 500;
        color: var(--color-text);
        margin-top: var(--space-1);
      }

      .profile-meta {
        font-size: var(--text-meta);
        color: var(--color-text-muted);
        margin-top: var(--space-1);
      }

      .profile-stats {
        font-size: var(--text-meta);
        font-weight: 600;
        color: var(--color-primary);
        margin-top: var(--space-2);
        font-variant-numeric: tabular-nums;
      }
      .profile-stats span {
        margin-right: var(--space-3);
      }

      /* ── Section cards ───────────────────────────────────────────────────── */
      .section-body {
        padding: var(--space-5) var(--space-6) var(--space-6);
      }

      .section-heading {
        font-size: var(--text-title);
        font-weight: 700;
        color: var(--color-text);
        margin-bottom: var(--space-4);
      }

      /* ── About ───────────────────────────────────────────────────────────── */
      .about-text {
        font-size: var(--text-small);
        line-height: var(--leading-copy);
        color: var(--color-text-muted);
        white-space: pre-wrap;
      }

      /* ── Notebook card ───────────────────────────────────────────────────── */
      .notebook-item {
        padding: var(--space-4);
        border-radius: var(--radius-md);
        border: 1px solid var(--color-divider);
        background: var(--color-surface-muted);
        transition:
          box-shadow var(--motion-standard) var(--motion-ease),
          transform var(--motion-fast) var(--motion-ease);
      }
      .notebook-item:hover {
        box-shadow: var(--shadow-sm);
        transform: translateY(-1px);
      }
      .notebook-title {
        font-size: var(--text-small);
        font-weight: 700;
        color: var(--color-text);
      }
      .notebook-title-link {
        display: block;
        padding: 0;
        border: none;
        background: none;
        text-align: left;
        cursor: pointer;
        overflow-wrap: anywhere;
      }
      .notebook-title-link:hover,
      .notebook-title-link:focus-visible {
        text-decoration: underline;
      }
      .notebook-dept {
        font-size: var(--text-caption);
        color: var(--color-text-muted);
        margin-top: var(--space-1);
      }
      .notebook-item-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: var(--space-2);
      }
      .notebook-item-row > :first-child {
        flex: 1;
        min-width: 0;
      }
      .notebook-item-actions {
        display: flex;
        gap: var(--space-2);
        flex-shrink: 0;
      }
      /* Phones: the actions sit under the title so it keeps the full width. */
      @media (max-width: 480px) {
        .notebook-item-row {
          flex-direction: column;
          gap: var(--space-3);
        }
      }

      /* ── Match pill ──────────────────────────────────────────────────────── */
      .match-pill {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-3) var(--space-4);
        border-radius: var(--radius-md);
        border: 1px solid var(--color-divider);
        background: var(--color-surface-muted);
        text-decoration: none;
        transition: background var(--motion-fast) var(--motion-ease);
      }
      .match-pill:hover {
        background: var(--color-primary-soft);
      }
      .match-avatar-sm {
        width: 36px;
        height: 36px;
        border-radius: var(--radius-pill);
        background: var(--color-brand-gradient);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--text-caption);
        font-weight: 700;
        color: var(--color-on-header);
        flex-shrink: 0;
      }

      /* ── Own badge ───────────────────────────────────────────────────────── */
      .own-badge {
        font-size: var(--text-caption);
        font-weight: 700;
        padding: 2px var(--space-2);
        border-radius: var(--radius-pill);
        background: var(--color-primary-soft);
        color: var(--color-primary);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      /* ── Divider ─────────────────────────────────────────────────────────── */
      .divider {
        height: 1px;
        background: var(--color-divider);
        margin: var(--space-4) 0;
      }

      /* ── Empty state ─────────────────────────────────────────────────────── */
      .empty-state {
        padding: var(--space-6) var(--space-4);
      }
    </style>
    <link rel="stylesheet" href="css/tailwind.css" />
  </head>

  <body class="page-bg font-sans min-h-screen transition-colors duration-300 text-gray-900 dark:text-purple-100">
    <!-- Header -->
    <header
      class="w-full overflow-hidden px-4 py-3 md:py-4 flex items-center justify-between gap-3 bg-gradient-to-r from-[#0f172a] via-[#4f46e5] to-[#9333ea] text-white sticky top-0 z-40 shadow-lg"
    >
      <button
        data-action="goHome"
        class="flex items-center gap-2 shrink-0 cursor-pointer bg-transparent border-none p-0"
      >
        <img
          src="Images/swappr_logo_updated.jpg"
          alt=""
          width="28"
          height="28"
          class="w-7 h-7 rounded-md shrink-0"
        />
        <h1 class="text-2xl font-extrabold tracking-tight truncate text-white">
          SWAPPR
        </h1>
      </button>
      <div class="flex items-center gap-2 min-w-0 flex-nowrap">
        <button
          id="themeToggle"
          class="w-11 h-11 md:w-8 md:h-8 rounded-full flex items-center justify-center glass-btn hover:scale-110 transition"
          title="Toggle theme"
          aria-label="Toggle theme"
        >
          <i data-lucide="moon" class="w-5 h-5"></i>
        </button>
        <button
          data-action="handleLogout"
          class="hidden md:inline-flex text-xs font-bold px-3 py-1.5 rounded-full glass-btn hover:bg-red-500/20 hover:scale-105 transition"
        >
          Logout
        </button>
        <button
          id="mobileMenuToggle"
          type="button"
          data-action="toggleMobileMenu"
          class="md:hidden w-11 h-11 rounded-full flex items-center justify-center glass-btn hover:scale-105 transition"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="mobileMenu"
        >
          <i data-mobile-menu-icon data-lucide="menu" class="w-5 h-5"></i>
        </button>
      </div>
    </header>

    <div
      id="mobileMenuOverlay"
      class="mobile-menu-overlay"
      data-action="closeMobileMenu"
    ></div>
    <nav
      id="mobileMenu"
      class="mobile-menu"
      aria-label="Mobile navigation"
    >
      <p
        class="text-xs font-bold uppercase tracking-widest mb-2 px-2 text-[color:var(--color-text-muted)]"
      >
        Profile
      </p>
      <button
        data-action="goHome"
        class="sidebar-link flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm font-semibold transition w-full text-left"
      >
        Home
      </button>
      <button
        data-action="handleLogout"
        class="mobile-menu-logout sidebar-link flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm font-semibold transition w-full text-left"
      >
        Logout
      </button>
    </nav>

    <!-- Content -->
    <div class="max-w-2xl mx-auto px-4 py-6 space-y-3">
      <!-- ── Hero card ─────────────────────────────────────────────────────── -->
      <div class="card">
        <!-- Cover -->
        <div class="cover" style="position: relative">
          <div class="avatar" id="avatarEl"></div>
        </div>

        <!-- Identity -->
        <div class="identity">
          <div class="flex items-start justify-between gap-3 flex-wrap">
            <div class="flex-1 min-w-0">
              <div class="profile-name">
                <span id="profileNameEl">—</span>
                <span class="own-badge" id="ownBadge" style="display: none"
                  >You</span
                >
              </div>
              <p class="profile-tagline" id="profileTaglineEl">—</p>
              <p class="profile-meta" id="profileMetaEl">—</p>
              <p class="profile-stats" id="profileStatsEl"></p>
              <p class="profile-stats" id="profileStandingEl"></p>
            </div>
            <!-- Action buttons -->
            <div class="flex gap-2 shrink-0 pt-1" id="profileActions"></div>
          </div>
        </div>
      </div>

      <!-- ── About ─────────────────────────────────────────────────────────── -->
      <div class="card">
        <div class="section-body">
          <div class="flex items-center justify-between mb-4">
            <h2 class="section-heading" style="margin-bottom: 0">Notebooks</h2>
            <button
              id="addNotebookBtn"
              class="btn-solid hidden"
              data-action="addNotebook"
            >
              Add notebook
            </button>
          </div>
          <div id="notebooksList" class="space-y-3"></div>
          <div id="noNotebooks" class="empty-card empty-state hidden">
            <span class="empty-card-icon" aria-hidden="true">
              <i data-lucide="notebook" class="w-5 h-5"></i>
            </span>
            <p class="empty-card-title">No notebooks yet.</p>
            <p class="empty-card-body">Published study notebooks will appear here.</p>
          </div>
        </div>
      </div>

      <div class="card" id="aboutCard">
        <div class="section-body">
          <h2 class="section-heading">About</h2>
          <p class="about-text" id="bioText">—</p>
        </div>
      </div>

      <!-- ── Notebooks ──────────────────────────────────────────────────────── -->
      <!-- ── Connections ────────────────────────────────────────────────────── -->
      <div class="card">
        <div class="section-body">
          <h2 class="section-heading">
            Swap partners
            <span
              id="matchCount"
              class="text-sm font-semibold text-[color:var(--color-text-muted)] ml-2"
            ></span>
          </h2>
          <div
            id="matchesList"
            class="grid grid-cols-1 sm:grid-cols-2 gap-3"
          ></div>
          <div id="noMatches" class="empty-card empty-state hidden">
            <span class="empty-card-icon" aria-hidden="true">
              <i data-lucide="handshake" class="w-5 h-5"></i>
            </span>
            <p class="empty-card-title">No swap partners yet.</p>
            <p class="empty-card-body">Completed swaps with other students will appear here.</p>
          </div>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="js/auth-storage.js"></script>
    <script src="js/mobile-menu.js"></script>
    <!-- PRF001: the same header scripts as index.html (theme, toast, chat and
         SWAPP checks), plus the shared Report dialog (RPT001) -->
    <script src="js/app/state.js"></script>
    <script src="js/app/api.js"></script>
    <script src="js/app/theme.js"></script>
    <script src="js/app/toast.js"></script>
    <script src="js/app/swapps.js"></script>
    <script src="js/app/chat.js"></script>
    <script src="js/app/report-modal.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
