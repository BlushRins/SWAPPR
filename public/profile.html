<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SWAPPR — My Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // General Logic: Inter on every page (Tailwind's font-sans included).
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      /* ── Page surfaces ───────────────────────────────────────────────────── */
      .page-bg {
        background: #f3f2ee;
      }
      .dark .page-bg {
        background: #0c0a18;
      }

      .card {
        background: white;
        border-radius: 10px;
        border: 1px solid #e5e0f0;
        overflow: hidden;
      }
      .dark .card {
        background: #110e20;
        border-color: rgba(255, 255, 255, 0.06);
      }

      /* ── Cover banner ────────────────────────────────────────────────────── */
      .cover {
        height: 200px;
        background: linear-gradient(
          135deg,
          #4a0080 0%,
          #5b5bd6 55%,
          #9b8ec4 100%
        );
        position: relative;
      }
      .dark .cover {
        background: linear-gradient(
          135deg,
          #2a0858 0%,
          #383478 60%,
          #1e1535 100%
        );
      }

      /* ── Avatar ──────────────────────────────────────────────────────────── */
      .avatar {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: linear-gradient(135deg, #4a0080, #5b5bd6);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.4rem;
        font-weight: 800;
        color: white;
        border: 4px solid white;
        box-shadow: 0 2px 12px rgba(74, 0, 128, 0.25);
        position: absolute;
        bottom: -48px;
        left: 24px;
        flex-shrink: 0;
      }
      .dark .avatar {
        border-color: #110e20;
      }

      /* ── Identity block ──────────────────────────────────────────────────── */
      .identity {
        padding: 64px 24px 20px;
      }

      .profile-name {
        font-size: 1.35rem;
        font-weight: 800;
        color: #1e1033;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .dark .profile-name {
        color: #f0eaff;
      }

      .profile-tagline {
        font-size: 0.9rem;
        font-weight: 500;
        color: #4a3d6b;
        margin-top: 2px;
      }
      .dark .profile-tagline {
        color: #b8aee8;
      }

      .profile-meta {
        font-size: 0.8rem;
        color: #7a6e90;
        margin-top: 4px;
      }
      .dark .profile-meta {
        color: #8878b8;
      }

      .profile-stats {
        font-size: 0.82rem;
        font-weight: 600;
        color: #4a0080;
        margin-top: 6px;
      }
      .dark .profile-stats {
        color: #a090c8;
      }
      .profile-stats span {
        margin-right: 12px;
      }

      /* ── Action buttons ──────────────────────────────────────────────────── */
      .btn-action {
        padding: 6px 18px;
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 700;
        font-family: "Inter", sans-serif;
        cursor: pointer;
        transition:
          opacity 0.2s,
          transform 0.15s;
        border: 1.5px solid transparent;
      }
      .btn-action-primary {
        background: linear-gradient(135deg, #4a0080, #7b2fbe);
        color: white;
        box-shadow: 0 2px 8px rgba(74, 0, 128, 0.25);
      }
      .btn-action-primary:hover {
        opacity: 0.88;
        transform: translateY(-1px);
      }
      .btn-action-outline {
        background: transparent;
        border-color: #7b2fbe;
        color: #7b2fbe;
      }
      .dark .btn-action-outline {
        border-color: #9b8ec4;
        color: #c4baf0;
      }
      .btn-action-outline:hover {
        background: rgba(123, 47, 190, 0.07);
      }

      /* ── Section cards ───────────────────────────────────────────────────── */
      .section-body {
        padding: 20px 24px 24px;
      }

      .section-heading {
        font-size: 1rem;
        font-weight: 800;
        color: #1e1033;
        margin-bottom: 14px;
      }
      .dark .section-heading {
        color: #f0eaff;
      }

      /* ── About ───────────────────────────────────────────────────────────── */
      .about-text {
        font-size: 0.875rem;
        line-height: 1.75;
        color: #3d3550;
        white-space: pre-wrap;
      }
      .dark .about-text {
        color: #c0b8d8;
      }

      /* ── Notebook card ───────────────────────────────────────────────────── */
      .notebook-item {
        padding: 16px;
        border-radius: 10px;
        border: 1px solid #ede9fe;
        background: #faf5ff;
        transition:
          box-shadow 0.2s,
          transform 0.15s;
      }
      .dark .notebook-item {
        background: #181428;
        border-color: rgba(255, 255, 255, 0.06);
      }
      .notebook-item:hover {
        box-shadow: 0 4px 16px rgba(74, 0, 128, 0.1);
        transform: translateY(-1px);
      }
      .notebook-title {
        font-size: 0.9rem;
        font-weight: 800;
        color: #1e1033;
      }
      .dark .notebook-title {
        color: #f0eaff;
      }
      .notebook-title-link {
        display: block;
        padding: 0;
        border: none;
        background: none;
        text-align: left;
        cursor: pointer;
        overflow-wrap: anywhere;
      }
      .notebook-title-link:hover,
      .notebook-title-link:focus-visible {
        text-decoration: underline;
      }
      .notebook-dept {
        font-size: 0.75rem;
        color: #8878b8;
        margin-top: 2px;
      }

      /* ── Match pill ──────────────────────────────────────────────────────── */
      .match-pill {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid #ede9fe;
        background: white;
        text-decoration: none;
        transition: background 0.15s;
      }
      .dark .match-pill {
        background: #181428;
        border-color: rgba(255, 255, 255, 0.06);
      }
      .match-pill:hover {
        background: #faf5ff;
      }
      .dark .match-pill:hover {
        background: rgba(108, 96, 184, 0.1);
      }
      .match-avatar-sm {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: linear-gradient(135deg, #4a0080, #7b2fbe);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.7rem;
        font-weight: 800;
        color: white;
        flex-shrink: 0;
      }

      /* ── Own badge ───────────────────────────────────────────────────────── */
      .own-badge {
        font-size: 0.62rem;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(74, 0, 128, 0.1);
        color: #4a0080;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .dark .own-badge {
        background: rgba(155, 142, 196, 0.15);
        color: #9b8ec4;
      }

      /* ── Divider ─────────────────────────────────────────────────────────── */
      .divider {
        height: 1px;
        background: #ede9fe;
        margin: 16px 0;
      }
      .dark .divider {
        background: rgba(255, 255, 255, 0.06);
      }

      /* ── Empty state ─────────────────────────────────────────────────────── */
      .empty-state {
        font-size: 0.85rem;
        color: #9b8ec4;
        font-style: italic;
        padding: 8px 0;
      }
    </style>
  </head>

  <body class="page-bg font-sans min-h-screen transition-colors duration-300">
    <!-- Header -->
    <header
      class="px-6 py-4 flex items-center justify-between bg-white dark:bg-[#110e20] border-b border-purple-100 dark:border-white/[0.06] sticky top-0 z-40 shadow-sm transition-colors duration-300"
    >
      <button
        onclick="goHome()"
        class="flex items-center gap-2 cursor-pointer bg-transparent border-none p-0 hover:opacity-75 transition-opacity"
      >
        <span class="text-2xl">⇄</span>
        <h1
          class="text-2xl font-extrabold tracking-tight text-purple-800 dark:text-purple-300"
          style="
            text-shadow:
              0 0 8px rgba(167, 139, 250, 0.8),
              0 0 20px rgba(124, 58, 237, 0.5);
          "
        >
          SWAPPR
        </h1>
      </button>
      <div class="flex items-center gap-3">
        <button
          id="themeToggle"
          class="w-8 h-8 rounded-full flex items-center justify-center text-sm border bg-[#faf5ff] dark:bg-[#181428] border-[#ddd6fe] dark:border-white/[0.06] transition"
        >
          <i data-lucide="moon" class="w-4 h-4"></i>
        </button>
        <button
          onclick="handleLogout()"
          class="hidden md:inline-flex text-xs font-bold px-3 py-1.5 rounded-full border transition text-purple-700 dark:text-purple-300 border-purple-200 dark:border-white/[0.1] hover:bg-purple-50 dark:hover:bg-white/[0.05]"
        >
          Logout
        </button>
        <button
          id="mobileMenuToggle"
          type="button"
          onclick="toggleMobileMenu()"
          class="md:hidden mobile-menu-button border border-purple-200 dark:border-white/[0.1]"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="mobileMenu"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <div
      id="mobileMenuOverlay"
      class="mobile-menu-overlay"
      onclick="closeMobileMenu()"
    ></div>
    <nav
      id="mobileMenu"
      class="mobile-menu"
      aria-label="Mobile navigation"
    >
      <p
        class="text-xs font-bold uppercase tracking-widest mb-2 px-2 text-purple-300 dark:text-purple-400"
      >
        Profile
      </p>
      <button
        onclick="goHome()"
        class="sidebar-link flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm font-semibold transition w-full text-left"
      >
        Home
      </button>
      <button
        onclick="handleLogout()"
        class="mobile-menu-logout sidebar-link flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm font-semibold transition w-full text-left"
      >
        Logout
      </button>
    </nav>

    <!-- Content -->
    <div class="max-w-2xl mx-auto px-4 py-6 space-y-3">
      <!-- ── Hero card ─────────────────────────────────────────────────────── -->
      <div class="card">
        <!-- Cover -->
        <div class="cover" style="position: relative">
          <div class="avatar" id="avatarEl"></div>
        </div>

        <!-- Identity -->
        <div class="identity">
          <div class="flex items-start justify-between gap-3 flex-wrap">
            <div class="flex-1 min-w-0">
              <div class="profile-name">
                <span id="profileNameEl">—</span>
                <span class="own-badge" id="ownBadge" style="display: none"
                  >You</span
                >
              </div>
              <p class="profile-tagline" id="profileTaglineEl">—</p>
              <p class="profile-meta" id="profileMetaEl">—</p>
              <p class="profile-stats" id="profileStatsEl"></p>
              <p class="profile-stats" id="profileStandingEl"></p>
            </div>
            <!-- Action buttons -->
            <div class="flex gap-2 shrink-0 pt-1" id="profileActions"></div>
          </div>
        </div>
      </div>

      <!-- ── About ─────────────────────────────────────────────────────────── -->
      <div class="card" id="aboutCard">
        <div class="section-body">
          <h2 class="section-heading">About</h2>
          <p class="about-text" id="bioText">—</p>
        </div>
      </div>

      <!-- ── Notebooks ──────────────────────────────────────────────────────── -->
      <div class="card">
        <div class="section-body">
          <div class="flex items-center justify-between mb-4">
            <h2 class="section-heading" style="margin-bottom: 0">Notebooks</h2>
            <button
              id="addNotebookBtn"
              class="btn-action btn-action-primary hidden"
              onclick="addNotebook()"
            >
              + Add Notebook
            </button>
          </div>
          <div id="notebooksList" class="space-y-3"></div>
          <p id="noNotebooks" class="empty-state hidden">No notebooks yet.</p>
        </div>
      </div>

      <!-- ── Connections ────────────────────────────────────────────────────── -->
      <div class="card">
        <div class="section-body">
          <h2 class="section-heading">
            SWAPP Matches
            <span
              id="matchCount"
              class="text-sm font-semibold text-purple-400 ml-2"
            ></span>
          </h2>
          <div
            id="matchesList"
            class="grid grid-cols-1 sm:grid-cols-2 gap-3"
          ></div>
          <p id="noMatches" class="empty-state hidden">No SWAPP matches yet.</p>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="js/auth-storage.js"></script>
    <script src="js/mobile-menu.js"></script>
    <!-- PRF001: the same header scripts as index.html (theme, toast, chat and
         SWAPP checks), plus the shared Report dialog (RPT001) -->
    <script src="js/app/state.js"></script>
    <script src="js/app/api.js"></script>
    <script src="js/app/theme.js"></script>
    <script src="js/app/toast.js"></script>
    <script src="js/app/swapps.js"></script>
    <script src="js/app/chat.js"></script>
    <script src="js/app/report-modal.js"></script>
    <script>
      // ── Theme ────────────────────────────────────────────────────────────────
      // Same toggle as index.html (js/app/theme.js, localStorage["theme"]).
      window.SWAPPR.attachThemeToggle();

      // ── Auth ─────────────────────────────────────────────────────────────────
      let currentUser = null;

      async function handleLogout() {
        await window.SWAPPR.auth.clearUser();
        window.location.replace("login.html");
      }
      function goHome() {
        window.location.href = "index.html";
      }

      // ── Toast ─────────────────────────────────────────────────────────────────
      function reportProfileUser() {
        if (!profileData) return;
        window.SWAPPR.openReportModal({
          type: "user",
          id: profileData.id,
          username: profileData.username,
        });
      }

      // The shared toast queue (js/app/toast.js), as on index.html.
      function showToast(message) {
        window.SWAPPR.showToast(message);
      }

      // PNL001 colour bands for a trust score: 95%+ green, 85%+ yellow,
      // below that red (the same bands as index.html).
      function trustToneClass(score) {
        if (score >= 95) return "text-green-500 dark:text-green-400";
        if (score >= 85) return "text-yellow-500 dark:text-yellow-400";
        return "text-red-500 dark:text-red-400";
      }

      // Shown to the author only: other students never receive these notebooks.
      function moderationNote(status) {
        if (status === "under_review") return "Under review — hidden from the feed";
        if (status === "removed") return "Removed by an admin";
        return "";
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          (ch) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[ch],
        );
      }

      // ── Whose profile? ────────────────────────────────────────────────────────
      const params = new URLSearchParams(window.location.search);
      let viewUser = "";
      let isOwn = false;

      // ── Load ──────────────────────────────────────────────────────────────────
      let profileData = null;

      async function loadProfile() {
        try {
          const res = await fetch(`/api/profile/${encodeURIComponent(viewUser)}`, {
            credentials: "same-origin",
          });
          const data = await res.json();
          if (!data.success) {
            showToast("Profile not found.");
            return;
          }
          profileData = data.profile;
          renderProfile(profileData);
        } catch {
          showToast("Failed to load profile.");
        }
      }

      function renderProfile(p) {
        // Avatar initials
        const initials = p.name
          ? p.name
              .split(" ")
              .map((w) => w[0])
              .join("")
              .toUpperCase()
              .slice(0, 2)
          : p.username.slice(0, 2).toUpperCase();
        document.getElementById("avatarEl").textContent = initials;
        document.title = `SWAPPR — ${p.name || p.username}`;

        // Name + tagline
        document.getElementById("profileNameEl").textContent =
          p.name || p.username;
        const taglineParts = [p.course, p.yearLevel].filter(Boolean);
        document.getElementById("profileTaglineEl").textContent =
          taglineParts.join(" · ") || "No course set";
        const metaParts = [`@${p.username}`];
        if (p.studentId) metaParts.push(`ID: ${p.studentId}`);
        if (p.department) metaParts.push(p.department);
        document.getElementById("profileMetaEl").textContent =
          metaParts.join(" · ");

        // Stats
        document.getElementById("profileStatsEl").innerHTML =
          `<span>${p.portfolios.length} Notebook${p.portfolios.length !== 1 ? "s" : ""}</span>` +
          `<span>${p.matches.length} SWAPP Connection${p.matches.length !== 1 ? "s" : ""}</span>` +
          `<span>${Number(p.completedSwapps) || 0} Completed SWAPP${p.completedSwapps !== 1 ? "s" : ""}</span>`;

        // FUNC-014 REQT-003: trust score, warning count and account status,
        // read-only for students (REQT-010).
        const trustScore = Number(p.trustScore ?? 100);
        const warnings = Number(p.warningCount) || 0;
        const status = p.accountStatus === "suspended" ? "Suspended" : "Active";
        document.getElementById("profileStandingEl").innerHTML =
          `<span class="${trustToneClass(trustScore)} font-bold">${trustScore}% Trust Score</span>` +
          `<span>${warnings} Warning${warnings !== 1 ? "s" : ""}</span>` +
          `<span>${status}</span>`;

        // Bio
        document.getElementById("bioText").textContent = p.bio || "No bio yet.";

        // Own controls
        if (isOwn) {
          document.getElementById("ownBadge").style.display = "inline-flex";
          document.getElementById("addNotebookBtn").classList.remove("hidden");
          document.getElementById("profileActions").innerHTML = `
            <button onclick="editProfile()" class="btn-action btn-action-primary">✏️ Edit Profile</button>`;
        } else {
          // FUNC-015 REQT-002: another student's profile can be reported.
          document.getElementById("profileActions").innerHTML = `
            <button onclick="reportProfileUser()" class="btn-action btn-action-outline">🚩 Report</button>
            <button onclick="goHome()" class="btn-action btn-action-outline">← Back</button>`;
        }

        // Notebooks
        const notebooksList = document.getElementById("notebooksList");
        const noNotebooks = document.getElementById("noNotebooks");
        if (p.portfolios.length === 0) {
          notebooksList.innerHTML = "";
          noNotebooks.classList.remove("hidden");
        } else {
          noNotebooks.classList.add("hidden");
          notebooksList.innerHTML = p.portfolios
            .map(
              (n) => `
            <div class="notebook-item">
              <div class="flex items-start justify-between gap-2">
                <div class="flex-1 min-w-0">
                  <button type="button" onclick="openNotebook(${Number(n.id)})" class="notebook-title notebook-title-link">${escapeHtml(n.title)}</button>
                  <p class="notebook-dept">${escapeHtml(n.department || "No department")}</p>
                  ${
                    moderationNote(n.status)
                      ? `<p class="text-xs font-semibold text-red-500 dark:text-red-400 mt-1">${moderationNote(n.status)}</p>`
                      : ""
                  }
                </div>
                ${
                  isOwn
                    ? `
                  <div class="flex gap-1.5 shrink-0">
                    ${
                      moderationNote(n.status)
                        ? ""
                        : `<button onclick="editNotebook(${n.id})" class="edit-btn">✏️ Edit</button>`
                    }
                    <button onclick="deleteNotebook(${n.id})" class="delete-btn">🗑️</button>
                  </div>`
                    : ""
                }
              </div>
            </div>`,
            )
            .join("");
        }

        // Connections
        const matchesList = document.getElementById("matchesList");
        const noMatches = document.getElementById("noMatches");
        document.getElementById("matchCount").textContent = p.matches.length
          ? `· ${p.matches.length}`
          : "";

        if (p.matches.length === 0) {
          matchesList.innerHTML = "";
          noMatches.classList.remove("hidden");
        } else {
          noMatches.classList.add("hidden");
          // FUNC-014 REQT-002: each partner with their trust score.
          matchesList.innerHTML = p.matches
            .map(
              ({ username: u, trustScore: partnerTrust }) => `
            <a href="profile.html?user=${encodeURIComponent(u)}" class="match-pill">
              <div class="match-avatar-sm">${escapeHtml(u.slice(0, 2).toUpperCase())}</div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-bold text-purple-900 dark:text-purple-100 truncate">@${escapeHtml(u)}</p>
                <p class="text-xs text-purple-400">SWAPP match · <span class="${trustToneClass(Number(partnerTrust))} font-bold">${escapeHtml(partnerTrust)}% Trust Score</span></p>
              </div>
              <span class="text-xs text-emerald-500 font-bold shrink-0">✅ Matched</span>
            </a>`,
            )
            .join("");
        }
      }

      // ── Edit Profile ──────────────────────────────────────────────────────────
      // FUNC-014 REQT-005: editing happens in the Profile panel's Edit Profile
      // modal, so hand off to it the same way editNotebook() does.
      function editProfile() {
        sessionStorage.setItem("openEditProfile", "1");
        window.location.href = "index.html";
      }

      // ── Notebook actions ──────────────────────────────────────────────────────
      // FUNC-014 REQT-004: a title opens Notebook Details (MOD004) on the
      // main page, handed off like editNotebook() below.
      function openNotebook(notebookId) {
        sessionStorage.setItem("openNotebookId", notebookId);
        window.location.href = "index.html";
      }

      // PRF001: + Add Notebook opens the New Notebook modal on index.html.
      function addNotebook() {
        sessionStorage.setItem("openAddNotebook", "1");
        window.location.href = "index.html";
      }

      function editNotebook(notebookId) {
        sessionStorage.setItem("editNotebookId", notebookId);
        window.location.href = "index.html";
      }

      async function deleteNotebook(notebookId) {
        // FUNC-009 REQT-008
        if (!confirm("Are you sure you want to delete this notebook?")) return;
        try {
          const res = await fetch("/api/portfolios/delete", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify({ id: notebookId }),
          });
          const data = await res.json();
          if (data.success) {
            // FUNC-009 REQT-009: "Notebook deleted." then My Subjects on
            // index.html, which shows the toast when it opens.
            sessionStorage.setItem("openView", "mine");
            sessionStorage.setItem("flashMessage", "Notebook deleted.");
            window.location.href = "index.html";
          } else {
            // e.g. FUNC-009 REQT-011: the notebook is in an open SWAPP.
            showToast(data.message || "Failed to delete.");
          }
        } catch {
          showToast("Failed to delete.");
        }
      }

      // ── Init ──────────────────────────────────────────────────────────────────
      async function initProfile() {
        try {
          currentUser = await window.SWAPPR.auth.getUser();
          if (!currentUser) throw new Error();
        } catch {
          await window.SWAPPR.auth.clearUser();
          window.location.replace("login.html");
          return;
        }

        viewUser = params.get("user") || currentUser.username;
        isOwn = viewUser === currentUser.username;
        loadProfile();

        // New-message and cancelled-SWAPP popups, as on index.html. A SWAPP
        // change (accepted, cancelled) reloads this profile's matches.
        window.SWAPPR.state.currentUser = currentUser;
        window.SWAPPR.reloadAfterSwappChange = loadProfile;
        window.SWAPPR.startChatNotifications();
        window.SWAPPR.startSwappUpdates();
      }

      initProfile();
    </script>
  </body>
</html>
