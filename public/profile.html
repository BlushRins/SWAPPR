<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile | SWAPPR</title>
    <meta name="description" content="A SWAPPR student profile: their notebooks, swap partners and standing." />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/vendor/lucide.js"></script>
    <script src="js/actions.js"></script>
    <link rel="stylesheet" href="css/tailwind.css" />
  </head>

  <body>
    <!-- Header: wordmark, theme, log out -->
    <header class="app-bar">
      <button type="button" data-action="goHome" class="app-brand">
        <i data-lucide="repeat" class="app-brand-icon" aria-hidden="true"></i>
        <span class="app-brand-name">SWAPPR</span>
      </button>
      <div class="app-bar-actions">
        <button type="button" data-action="goHome" class="hidden md:inline-flex btn-outline">
          Browse subjects
        </button>
        <button
          id="themeToggle"
          type="button"
          class="icon-btn"
          title="Switch theme"
          aria-label="Switch theme"
        >
          <i data-lucide="moon" class="w-5 h-5"></i>
        </button>
        <button type="button" data-action="handleLogout" class="hidden md:inline-flex btn-outline">
          Log out
        </button>
        <button
          id="mobileMenuToggle"
          type="button"
          data-action="toggleMobileMenu"
          class="md:hidden icon-btn"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="mobileMenu"
        >
          <i data-mobile-menu-icon data-lucide="menu" class="w-5 h-5"></i>
        </button>
      </div>
    </header>

    <div
      id="mobileMenuOverlay"
      class="mobile-menu-overlay"
      data-action="closeMobileMenu"
    ></div>
    <nav
      id="mobileMenu"
      class="mobile-menu"
      aria-label="Mobile navigation"
    >
      <p
        class="panel-label mb-2 px-2"
      >
        Profile
      </p>
      <button
        data-action="goHome"
        class="sidebar-link flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm font-semibold w-full text-left"
      >
        Browse subjects
      </button>
      <button
        data-action="handleLogout"
        class="mobile-menu-logout sidebar-link flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm font-semibold w-full text-left"
      >
        Log out
      </button>
    </nav>

    <!-- Content -->
    <main class="page-column profile-page">
      <section class="profile-identity" aria-labelledby="profileNameEl">
        <div class="avatar" id="avatarEl" aria-hidden="true"></div>
        <div class="profile-identity-text">
          <div class="profile-name-row">
            <h1 class="profile-name" id="profileNameEl">Loading profile…</h1>
            <span class="own-badge" id="ownBadge" style="display: none">You</span>
          </div>
          <p class="profile-tagline" id="profileTaglineEl"></p>
          <p class="profile-meta" id="profileMetaEl"></p>
        </div>
        <!-- Action buttons -->
        <div class="profile-actions" id="profileActions"></div>
      </section>

      <dl class="profile-figures" aria-label="Profile figures">
        <div class="profile-figures-group" id="profileStatsEl"></div>
        <div class="profile-figures-group" id="profileStandingEl"></div>
      </dl>

      <section class="profile-section" aria-labelledby="notebooksHeading">
        <div class="profile-section-head">
          <h2 class="section-heading" id="notebooksHeading">Notebooks</h2>
          <button
            id="addNotebookBtn"
            type="button"
            class="btn-solid hidden"
            data-action="addNotebook"
          >
            Add notebook
          </button>
        </div>
        <div id="notebooksList" class="profile-list"></div>
        <p id="noNotebooks" class="empty-state hidden">No notebooks yet.</p>
      </section>

      <section class="profile-section" id="aboutCard" aria-labelledby="aboutHeading">
        <h2 class="section-heading" id="aboutHeading">About</h2>
        <p class="about-text" id="bioText"></p>
      </section>

      <section class="profile-section" aria-labelledby="partnersHeading">
        <h2 class="section-heading" id="partnersHeading">
          Swap partners
          <span id="matchCount" class="section-count"></span>
        </h2>
        <div id="matchesList" class="partner-grid"></div>
        <p id="noMatches" class="empty-state hidden">No swap partners yet.</p>
      </section>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="js/auth-storage.js"></script>
    <script src="js/mobile-menu.js"></script>
    <!-- PRF001: the same header scripts as index.html (theme, toast, chat and
         SWAPP checks), plus the shared Report dialog (RPT001) -->
    <script src="js/app/state.js"></script>
    <script src="js/app/api.js"></script>
    <script src="js/app/theme.js"></script>
    <script src="js/app/toast.js"></script>
    <script src="js/app/swapps.js"></script>
    <script src="js/app/chat.js"></script>
    <script src="js/app/report-modal.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
