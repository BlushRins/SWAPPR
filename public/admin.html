<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moderation | SWAPPR</title>
    <meta name="description" content="SWAPPR moderation: flagged notebooks, reports and user accounts." />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/tailwind.css" />
    <script src="js/vendor/lucide.js"></script>
    <script src="js/actions.js"></script>
  </head>

  <body>
    <!-- Header: wordmark, admin tag, theme, account -->
    <header class="app-bar">
      <a href="#notebooks" data-view="notebooks" class="app-brand">
        <i data-lucide="repeat" class="app-brand-icon" aria-hidden="true"></i>
        <span class="app-brand-name">SWAPPR</span>
        <span class="admin-tag">Admin</span>
      </a>
      <div class="app-bar-actions">
        <span class="hidden sm:inline-flex account-btn account-static">
          <i data-lucide="shield" class="w-4 h-4" aria-hidden="true"></i>
          <span id="adminName"></span>
        </span>
        <button
          id="themeToggle"
          type="button"
          class="icon-btn"
          title="Switch theme"
          aria-label="Switch theme"
        >
          <i data-lucide="moon" class="w-5 h-5"></i>
        </button>
        <button type="button" data-action="adminLogout" class="hidden md:inline-flex btn-outline">
          Log out
        </button>
        <button
          id="mobileMenuToggle"
          type="button"
          data-action="toggleMobileMenu"
          class="md:hidden icon-btn"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="mobileMenu"
        >
          <i data-mobile-menu-icon data-lucide="menu" class="w-5 h-5"></i>
        </button>
      </div>
    </header>

    <!-- Mobile navigation -->
    <div id="mobileMenuOverlay" class="mobile-menu-overlay" data-action="closeMobileMenu"></div>
    <nav id="mobileMenu" class="mobile-menu" aria-label="Admin navigation">
      <p class="panel-label mb-2 px-2">
        Moderation
      </p>
      <a href="#notebooks" data-view="notebooks" class="sidebar-link active flex items-center justify-between gap-2 px-3 py-2.5 rounded-lg text-sm font-semibold">
        <span class="flex items-center gap-2"><i data-lucide="flag" class="w-4 h-4"></i>Flagged notebooks</span>
        <span data-count="notebooks" class="admin-count hidden">0</span>
      </a>
      <a href="#reports" data-view="reports" class="sidebar-link flex items-center justify-between gap-2 px-3 py-2.5 rounded-lg text-sm font-semibold">
        <span class="flex items-center gap-2"><i data-lucide="file-warning" class="w-4 h-4"></i>Reports</span>
        <span data-count="reports" class="admin-count hidden">0</span>
      </a>
      <a href="#users" data-view="users" class="sidebar-link flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm font-semibold">
        <i data-lucide="users" class="w-4 h-4"></i>User accounts
      </a>
      <button
        data-action="adminLogout"
        class="mobile-menu-logout sidebar-link flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm font-semibold w-full text-left"
      >
        <i data-lucide="log-out" class="w-4 h-4"></i>
        Log out
      </button>
    </nav>

    <div class="dashboard-shell">
      <!-- Sidebar (FUNC-016 REQT-002, REQT-003) -->
      <aside class="app-sidebar hidden md:flex" aria-label="Moderation"
      >
        <div>
          <p class="panel-label mb-2 px-2">
            Moderation
          </p>
          <nav class="space-y-1">
            <a href="#notebooks" data-view="notebooks" class="sidebar-link active flex items-center justify-between gap-2 px-3 py-2.5 rounded-lg text-sm font-semibold">
              <span class="flex items-center gap-2"><i data-lucide="flag" class="w-4 h-4"></i>Flagged notebooks</span>
              <span data-count="notebooks" class="admin-count hidden" title="Notebooks under review">0</span>
            </a>
            <a href="#reports" data-view="reports" class="sidebar-link flex items-center justify-between gap-2 px-3 py-2.5 rounded-lg text-sm font-semibold">
              <span class="flex items-center gap-2"><i data-lucide="file-warning" class="w-4 h-4"></i>Reports</span>
              <span data-count="reports" class="admin-count hidden" title="Open reports">0</span>
            </a>
            <a href="#users" data-view="users" class="sidebar-link flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm font-semibold">
              <i data-lucide="users" class="w-4 h-4"></i>User accounts
            </a>
          </nav>
        </div>
      </aside>

      <main class="dashboard-main">
        <div class="page-column page-column-wide">
          <div class="page-head">
            <h1 id="adminTitle" class="page-title">Flagged notebooks</h1>
            <p id="adminSubtitle" class="page-subtitle"></p>
          </div>

          <!-- ADM001 — Flagged Notebooks -->
          <section data-view-panel="notebooks">
            <div class="admin-card">
              <div id="notebooksTable" class="admin-table-wrap"></div>
            </div>
            <div id="notebooksPagination" class="pagination admin-pagination hidden"></div>
          </section>

          <!-- ADM002 — Reports -->
          <section data-view-panel="reports" class="hidden">
            <div class="admin-toolbar">
              <input
                type="search"
                id="reportsSearch"
                placeholder="Search reports..."
                aria-label="Search reports"
                autocomplete="off"
                maxlength="50"
                class="admin-search"
              />
            </div>
            <div class="admin-card">
              <div id="reportsTable" class="admin-table-wrap"></div>
            </div>
            <div id="reportsPagination" class="pagination admin-pagination hidden"></div>
          </section>

          <!-- ADM003 — User Accounts -->
          <section data-view-panel="users" class="hidden">
            <div class="admin-toolbar">
              <input
                type="search"
                id="usersSearch"
                placeholder="Search users..."
                aria-label="Search users"
                autocomplete="off"
                maxlength="50"
                class="admin-search"
              />
              <p id="usersWarningNote" class="admin-muted text-xs"></p>
            </div>
            <div class="admin-card">
              <div id="usersTable" class="admin-table-wrap"></div>
            </div>
            <div id="usersPagination" class="pagination admin-pagination hidden"></div>
          </section>
        </div>
      </main>
    </div>

    <!-- Detail modal: flagged notebook / report -->
    <div id="adminModal" class="modal-overlay hidden" data-action="closeAdminModal-overlay">
      <div class="modal-box admin-modal-box" role="dialog" aria-modal="true" aria-labelledby="adminModalTitle">
        <button type="button" data-action="closeAdminModal" class="report-modal-close" aria-label="Close">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
        <h3
          id="adminModalTitle"
          class="text-xl font-extrabold mb-4 pr-8 flex items-center gap-2"
        ></h3>
        <div id="adminModalBody"></div>
      </div>
    </div>

    <!-- View Specific User slide-over (FUNC-018 REQT-006) -->
    <div id="adminUserOverlay" class="profile-overlay" data-action="closeAdminUserPanel"></div>
    <aside id="adminUserPanel" class="profile-panel admin-user-panel" aria-label="User details">
      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-2">
          <i data-lucide="user" class="w-5 h-5"></i>
          <span class="panel-label">
            User Account
          </span>
        </div>
        <button
          type="button"
          data-action="closeAdminUserPanel"
          aria-label="Close"
          class="w-7 h-7 rounded-full flex items-center justify-center text-sm font-bold"
        >
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div id="adminUserPanelBody"></div>
    </aside>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="js/pagination.js"></script>
    <script src="js/date-format.js"></script>
    <script src="js/auth-storage.js"></script>
    <script src="js/app/theme.js"></script>
    <script src="js/app/toast.js"></script>
    <script src="js/app/admin-api.js"></script>
    <script src="js/app/admin-ui.js"></script>
    <script src="js/app/admin-notebooks.js"></script>
    <script src="js/app/admin-reports.js"></script>
    <script src="js/app/admin-users.js"></script>
    <script src="js/mobile-menu.js"></script>
    <script src="js/app/debounce.js"></script>
    <script src="js/app/admin-main.js"></script>
  </body>
</html>
